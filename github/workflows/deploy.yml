name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy Frontend Folder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend   
          branch: gh-pages