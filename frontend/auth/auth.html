<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collab — Sign in & Registration</title>
    <meta name="description" content="Sign in or register for your Collab workspace." />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="stylesheet" href="./auth.css">
</head>

<body>
    <div class="auth-bg-decor" aria-hidden="true">
        <div class="auth-bg-glow glow-1"></div>
        <div class="auth-bg-glow glow-2"></div>
        <div class="auth-bg-glow glow-3"></div>
    </div>

    <div class="auth">
        <div class="auth-container">
            <div class="auth-card">

                <div class="auth-card-header">
                    <div class="auth-logo">
                        <a href="../index.html">
                            <img src="../images/logo.png" alt="Collab." class="auth-logo-img" />
                        </a>
                    </div>

                    <h1 id="auth-heading">Sign in to Collab</h1>

                    <p class="auth-subtitle" id="auth-subheading">
                        Sign in to access your Collab workspace dashboard.
                    </p>
                </div>

                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" id="tab-signin" aria-selected="true">
                        Sign In
                    </button>

                    <button type="button" class="auth-tab" id="tab-register" aria-selected="false">
                        Sign Up
                    </button>
                </div>

                <form id="form-signin" class="auth-form-panel active" novalidate>

                    <div class="form-error-alert" id="signin-error-alert" style="display: none;"></div>

                    <div class="input-group" id="group-signin-user">
                        <label for="signin-user">
                            Email address
                            <span class="required">*</span>
                        </label>

                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                    </path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>

                            <input id="signin-user" type="email" placeholder="you@company.com" autocomplete="email"
                                required />
                        </div>

                        <span class="field-error-msg" id="signin-user-error"></span>
                    </div>

                    <div class="input-group" id="group-signin-password">
                        <label for="signin-password">
                            Password
                            <span class="required">*</span>
                        </label>

                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input class="password-input" id="signin-password" type="password"
                                placeholder="Enter your password" autocomplete="current-password" required />
                            <button class="password-toggle-btn" type="button" data-password-toggle="signin-password"
                                aria-label="Show password" aria-pressed="false">
                                <svg class="password-toggle-show" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="password-toggle-hide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                    <path d="m3 3 18 18"></path>
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                    <path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9"></path>
                                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
                                </svg>
                            </button>
                        </div>

                        <span class="field-error-msg" id="signin-password-error"></span>
                    </div>

                    <button type="submit" class="auth-submit-btn" id="signin-submit-btn">
                        <span>Sign In</span>
                        <span>→</span>
                    </button>

                    <div class="auth-divider">
                        <span>OR SIGN IN WITH</span>
                    </div>

                    <div class="auth-social-grid">

                        <button type="button" class="auth-social-btn" id="google-signin-btn"
                            aria-label="Sign in with Google">
                            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#4285F4"
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853"
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05"
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                                <path fill="#EA4335"
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                            </svg>

                            <span>Google</span>
                        </button>

                        <button type="button" class="auth-social-btn" id="github-signin-btn"
                            aria-label="Sign in with GitHub">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#24292F" aria-hidden="true">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                            </svg>

                            <span>GitHub</span>
                        </button>

                        <button type="button" class="auth-social-btn" id="microsoft-signin-btn"
                            aria-label="Sign in with Microsoft">
                            <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
                                <path fill="#f25022" d="M1 1h9v9H1z" />
                                <path fill="#7fba00" d="M11 1h9v9h-9z" />
                                <path fill="#00a4ef" d="M1 11h9v9H1z" />
                                <path fill="#ffb900" d="M11 11h9v9h-9z" />
                            </svg>

                            <span>Microsoft</span>
                        </button>

                    </div>
                </form>

                <form id="form-register" class="auth-form-panel" novalidate>

                    <div class="form-error-alert" id="register-error-alert" style="display: none;"></div>

                    <div class="input-group" id="group-reg-name">
                        <label for="reg-name">
                            Your Full Name
                            <span class="required">*</span>
                        </label>

                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>

                            <input id="reg-name" type="text" placeholder="e.g. David Makau" autocomplete="name"
                                required />
                        </div>

                        <span class="field-error-msg" id="reg-name-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-email">
                        <label for="reg-email">
                            Work Email
                            <span class="required">*</span>
                        </label>

                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                    </path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>

                            <input id="reg-email" type="email" placeholder="you@company.com" autocomplete="email"
                                required />
                        </div>

                        <span class="field-error-msg" id="reg-email-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-phone">
                        <label for="reg-phone">Phone Number <span class="required">*</span></label>
                        <div class="phone-number-fields">
                            <select id="reg-phone-country" aria-label="Country calling code" required>
                                <option value="">Country code</option>
                                <option value="+1" data-countries="US,CA">🇺🇸🇨🇦 United States / Canada (+1)</option>
                                <option value="+44" data-countries="GB">🇬🇧 United Kingdom (+44)</option>
                                <option value="+254" data-countries="KE">🇰🇪 Kenya (+254)</option>
                                <option value="+27" data-countries="ZA">🇿🇦 South Africa (+27)</option>
                                <option value="+61" data-countries="AU">🇦🇺 Australia (+61)</option>
                                <option value="+64" data-countries="NZ">🇳🇿 New Zealand (+64)</option>
                                <option value="+91" data-countries="IN">🇮🇳 India (+91)</option>
                                <option value="+234" data-countries="NG">🇳🇬 Nigeria (+234)</option>
                                <option value="+256" data-countries="UG">🇺🇬 Uganda (+256)</option>
                                <option value="+255" data-countries="TZ">🇹🇿 Tanzania (+255)</option>
                                <option value="+233" data-countries="GH">🇬🇭 Ghana (+233)</option>
                                <option value="+250" data-countries="RW">🇷🇼 Rwanda (+250)</option>
                                <option value="+251" data-countries="ET">🇪🇹 Ethiopia (+251)</option>
                                <option value="+20" data-countries="EG">🇪🇬 Egypt (+20)</option>
                                <option value="+971" data-countries="AE">🇦🇪 United Arab Emirates (+971)</option>
                                <option value="+966" data-countries="SA">🇸🇦 Saudi Arabia (+966)</option>
                                <option value="+33" data-countries="FR">🇫🇷 France (+33)</option>
                                <option value="+49" data-countries="DE">🇩🇪 Germany (+49)</option>
                                <option value="+34" data-countries="ES">🇪🇸 Spain (+34)</option>
                                <option value="+39" data-countries="IT">🇮🇹 Italy (+39)</option>
                                <option value="+31" data-countries="NL">🇳🇱 Netherlands (+31)</option>
                                <option value="+353" data-countries="IE">🇮🇪 Ireland (+353)</option>
                                <option value="+81" data-countries="JP">🇯🇵 Japan (+81)</option>
                                <option value="+82" data-countries="KR">🇰🇷 South Korea (+82)</option>
                                <option value="+86" data-countries="CN">🇨🇳 China (+86)</option>
                                <option value="+55" data-countries="BR">🇧🇷 Brazil (+55)</option>
                                <option value="+52" data-countries="MX">🇲🇽 Mexico (+52)</option>
                            </select>
                            <input id="reg-phone" type="tel" placeholder="Phone number" autocomplete="tel-national"
                                inputmode="tel" required />
                        </div>
                        <span class="field-error-msg" id="reg-phone-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-collaboration-type">
                        <label for="reg-collaboration-type">
                            Type of Collaboration
                            <span class="required">*</span>
                        </label>

                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-building-complex preview-icon">
                                    <path d="M10 12h4" />
                                    <path d="M10 8h4" />
                                    <path d="M14 21v-3a2 2 0 0 0-4 0v3" />
                                    <path
                                        d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" />
                                    <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
                                </svg>
                            </span>
                            <select id="reg-collaboration-type" required>
                                <option value="">Choose a collaboration type</option>
                                <option value="Product collaboration">Product collaboration</option>
                                <option value="Event partnership">Event partnership</option>
                                <option value="Content creation">Content creation</option>
                                <option value="Influencer campaign">Influencer campaign</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <span class="field-error-msg" id="reg-collaboration-type-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-collaboration-other" hidden>
                        <label for="reg-collaboration-other">
                            Describe the Campaign or Collaboration
                            <span class="required">*</span>
                        </label>

                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 20h9"></path>
                                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
                                </svg>
                            </span>
                            <input id="reg-collaboration-other" type="text"
                                placeholder="Tell us what you would like to work on" />
                        </div>

                        <span class="field-error-msg" id="reg-collaboration-other-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-workspace">
                        <label for="reg-workspace">
                            Brand or Company Name
                            <span class="required">*</span>
                        </label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 21h18"></path>
                                    <path d="M5 21V7l8-4v18"></path>
                                    <path d="M19 21V11l-6-4"></path>
                                    <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"></path>
                                </svg>
                            </span>
                            <input id="reg-workspace" type="text" placeholder="e.g. Northstar"
                                autocomplete="organization" required />
                        </div>
                        <span class="field-error-msg" id="reg-workspace-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-role">
                        <label for="reg-role">
                            Role or Job Title
                            <span class="required">*</span>
                        </label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="8" r="4"></circle>
                                    <path d="M5 21a7 7 0 0 1 14 0"></path>
                                </svg>
                            </span>
                            <input id="reg-role" type="text" placeholder="e.g. Marketing Manager"
                                autocomplete="organization-title" required />
                        </div>
                        <span class="field-error-msg" id="reg-role-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-industry">
                        <label for="reg-industry">
                            Industry
                            <span class="required">*</span>
                        </label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M12 2a15 15 0 0 1 0 20"></path>
                                    <path d="M2 12h20"></path>
                                </svg>
                            </span>
                            <select id="reg-industry" required>
                                <option value="">Choose an industry</option>
                                <option value="Advertising and Marketing">Advertising and Marketing</option>
                                <option value="Agriculture">Agriculture</option>
                                <option value="Automotive">Automotive</option>
                                <option value="Construction and Real Estate">Construction and Real Estate</option>
                                <option value="Consumer Goods">Consumer Goods</option>
                                <option value="Education">Education</option>
                                <option value="Energy and Utilities">Energy and Utilities</option>
                                <option value="Entertainment and Media">Entertainment and Media</option>
                                <option value="Fashion and Beauty">Fashion and Beauty</option>
                                <option value="Financial Services">Financial Services</option>
                                <option value="Food and Beverage">Food and Beverage</option>
                                <option value="Government and Public Sector">Government and Public Sector</option>
                                <option value="Healthcare and Life Sciences">Healthcare and Life Sciences</option>
                                <option value="Hospitality and Tourism">Hospitality and Tourism</option>
                                <option value="Manufacturing">Manufacturing</option>
                                <option value="Nonprofit">Nonprofit</option>
                                <option value="Professional Services">Professional Services</option>
                                <option value="Retail and E-commerce">Retail and E-commerce</option>
                                <option value="Technology">Technology</option>
                                <option value="Transportation and Logistics">Transportation and Logistics</option>
                            </select>
                        </div>
                        <span class="field-error-msg" id="reg-industry-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-password">
                        <label for="reg-password">
                            Password
                            <span class="required">*</span>
                        </label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input class="password-input" id="reg-password" type="password"
                                placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required />
                            <button class="password-toggle-btn" type="button" data-password-toggle="reg-password"
                                aria-label="Show password" aria-pressed="false">
                                <svg class="password-toggle-show" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="password-toggle-hide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                    <path d="m3 3 18 18"></path>
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                    <path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9"></path>
                                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error-msg" id="reg-password-error"></span>
                    </div>

                    <div class="input-group" id="group-reg-password-confirm">
                        <label for="reg-password-confirm">
                            Confirm Password
                            <span class="required">*</span>
                        </label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input class="password-input" id="reg-password-confirm" type="password"
                                placeholder="Re-enter your password" autocomplete="new-password" minlength="6" required />
                            <button class="password-toggle-btn" type="button"
                                data-password-toggle="reg-password-confirm" aria-label="Show password"
                                aria-pressed="false">
                                <svg class="password-toggle-show" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="password-toggle-hide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                    <path d="m3 3 18 18"></path>
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                    <path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9"></path>
                                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error-msg" id="reg-password-confirm-error"></span>
                    </div>
