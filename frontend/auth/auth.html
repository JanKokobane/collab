<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collab — Sign in & Registration</title>
    <meta name="description" content="Sign in or register for your Collab workspace. Instant direct access enabled." />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="stylesheet" href="./auth.css">
</head>

<body>
    <!-- Ambient Atmospheric Background Elements -->
    <div class="auth-bg-decor" aria-hidden="true">
        <div class="auth-bg-glow glow-1"></div>
        <div class="auth-bg-glow glow-2"></div>
        <div class="auth-bg-glow glow-3"></div>
    </div>

    <div class="auth">
        <div class="auth-container">
            <div class="auth-top-bar">
                <a href="../index.html" class="back-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Collab Home</span>
                </a>
            </div>

            <div class="auth-card">
                <div class="auth-card-header">
                    <div class="auth-logo">
                        <a href=""><img src="../images/logo.png" alt="Collab." class="auth-logo-img" /></a>
                    </div>
                    
                    <h1 id="auth-heading">Sign in</h1>
                    <p class="auth-subtitle" id="auth-subheading">Any user can sign in immediately — or register your workspace profile below.</p>
                </div>

                <!-- Tab Switcher: Sign in / Registration -->
                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" id="tab-signin">Sign In</button>
                    <button type="button" class="auth-tab" id="tab-register">Register New Account</button>
                </div>

                <!-- PANEL 1: SIGN IN (Direct access, no registration required) -->
                <form id="form-signin" class="auth-form-panel active">
                    <div class="input-group">
                        <label for="signin-user">Name or Email address <span class="required">*</span></label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input id="signin-user" type="text" placeholder="user@mail.com" />
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signin-password">Password <span class="required">*</span></label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input id="signin-password" class="password-input" type="password" placeholder="••••••••" />
                            <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Show password" title="Show password">
                                <svg class="eye-open-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-closed-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        <span>Enter Workspace Dashboard</span>
                        <span>→</span>
                    </button>

                    <div class="auth-divider">
                        <span>OR SIGN IN WITH</span>
                    </div>

                    <div class="auth-social-grid">
                        <button type="button" class="auth-social-btn" aria-label="Sign in with Google">
                            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>Google</span>
                        </button>
                        <button type="button" class="auth-social-btn" aria-label="Sign in with GitHub">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#24292F" aria-hidden="true">
                                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                            </svg>
                            <span>GitHub</span>
                        </button>
                        <button type="button" class="auth-social-btn" aria-label="Sign in with Microsoft">
                            <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
                                <path fill="#f25022" d="M1 1h9v9H1z"/>
                                <path fill="#7fba00" d="M11 1h9v9h-9z"/>
                                <path fill="#00a4ef" d="M1 11h9v9H1z"/>
                                <path fill="#ffb900" d="M11 11h9v9h-9z"/>
                            </svg>
                            <span>Microsoft</span>
                        </button>
                    </div>
                </form>

                <!-- PANEL 2: REGISTRATION (Hold registration details) -->
                <form id="form-register" class="auth-form-panel">
                    <div class="input-group">
                        <label for="reg-name">Your Full Name</label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input id="reg-name" type="text" placeholder="e.g. Jordan Lee" />
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="reg-email">Work Email</label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input id="reg-email" type="email" placeholder="you@company.com" />
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="reg-workspace">Workspace / Team Name</label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                </svg>
                            </span>
                            <input id="reg-workspace" type="text" placeholder="e.g. Northstar Product Launch" value="Product Launch" />
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="reg-role">Role in Team</label>
                        <div class="input-field-wrap">
                            <span class="input-field-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                            </span>
                            <select id="reg-role">
                                <option value="Product Lead">Product Lead</option>
                                <option value="Designer">Designer</option>
                                <option value="Engineer">Software Engineer</option>
                                <option value="Marketing">Marketing Manager</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        <span>Register & Create Workspace</span>
                        <span>→</span>
                    </button>

                    <div class="auth-divider">
                        <span>OR SIGN UP WITH</span>
                    </div>

                    <div class="auth-social-grid">
                        <button type="button" class="auth-social-btn" aria-label="Sign up with Google">
                            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>Google</span>
                        </button>
                        <button type="button" class="auth-social-btn" aria-label="Sign up with GitHub">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#24292F" aria-hidden="true">
                                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                            </svg>
                            <span>GitHub</span>
                        </button>
                        <button type="button" class="auth-social-btn" aria-label="Sign up with Microsoft">
                            <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
                                <path fill="#f25022" d="M1 1h9v9H1z"/>
                                <path fill="#7fba00" d="M11 1h9v9h-9z"/>
                                <path fill="#00a4ef" d="M1 11h9v9H1z"/>
                                <path fill="#ffb900" d="M11 11h9v9h-9z"/>
                            </svg>
                            <span>Microsoft</span>
                        </button>
                    </div>
                </form>

                <div class="auth-card-footer" style="margin-top: 20px; text-align: center; font-size: 12px; color: #71717A;">
                    <a href="../legal/privacy.html" style="color: #71717A; text-decoration: none; margin-right: 12px;">Privacy Policy</a>
                    <span>•</span>
                    <a href="../legal/terms.html" style="color: #71717A; text-decoration: none; margin: 0 12px;">Terms</a>
                    <span>•</span>
                    <span style="margin-left: 12px;">© <span class="current-year">2026</span> Collab</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./auth.js"></script>
</body>

</html>
