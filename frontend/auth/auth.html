<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collab — Sign in & Registration</title>
    <meta name="description" content="Sign in or register for your Collab workspace." />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="stylesheet" href="./auth.css">
</head>

<body>
    <div class="auth-bg-decor" aria-hidden="true">
        <div class="auth-bg-glow glow-1"></div>
        <div class="auth-bg-glow glow-2"></div>
        <div class="auth-bg-glow glow-3"></div>
    </div>

<div class="auth">
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-card-header">
                <div class="auth-logo">
                    <a href="../index.html">
                        <img src="../images/logo.png" alt="Collab." class="auth-logo-img" />
                    </a>
                </div>

                <h1 id="auth-heading">Sign in to Collab</h1>

                <p class="auth-subtitle" id="auth-subheading">
                    Sign in to access your Collab workspace dashboard.
                </p>
            </div>

            <div class="auth-tabs">
                <button
                    type="button"
                    class="auth-tab active"
                    id="tab-signin"
                    aria-selected="true"
                >
                    Sign In
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="tab-register"
                    aria-selected="false"
                >
                    Register New Account
                </button>
            </div>

            <form
                id="form-signin"
                class="auth-form-panel active"
                novalidate
            >

                <div
                    class="form-error-alert"
                    id="signin-error-alert"
                    style="display: none;"
                ></div>

                <div class="input-group" id="group-signin-user">
                    <label for="signin-user">
                        Email address
                        <span class="required">*</span>
                    </label>

                    <div class="input-field-wrap">
                        <span
                            class="input-field-icon"
                            aria-hidden="true"
                        >
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>

                        <input
                            id="signin-user"
                            type="email"
                            placeholder="you@company.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <span
                        class="field-error-msg"
                        id="signin-user-error"
                    ></span>
                </div>

                <button
                    type="submit"
                    class="auth-submit-btn"
                    id="signin-submit-btn"
                >
                    <span>Send Secure Login Link</span>
                    <span>→</span>
                </button>

                <div class="auth-divider">
                    <span>OR SIGN IN WITH</span>
                </div>

                <div class="auth-social-grid">

                    <button
                        type="button"
                        class="auth-social-btn"
                        id="google-signin-btn"
                        aria-label="Sign in with Google"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>

                        <span>Google</span>
                    </button>

                    <button
                        type="button"
                        class="auth-social-btn"
                        id="github-signin-btn"
                        aria-label="Sign in with GitHub"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="#24292F"
                            aria-hidden="true"
                        >
                            <path
                                fill-rule="evenodd"
                                clip-rule="evenodd"
                                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                            />
                        </svg>

                        <span>GitHub</span>
                    </button>

                    <button
                        type="button"
                        class="auth-social-btn"
                        id="microsoft-signin-btn"
                        aria-label="Sign in with Microsoft"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 21 21"
                            aria-hidden="true"
                        >
                            <path fill="#f25022" d="M1 1h9v9H1z"/>
                            <path fill="#7fba00" d="M11 1h9v9h-9z"/>
                            <path fill="#00a4ef" d="M1 11h9v9H1z"/>
                            <path fill="#ffb900" d="M11 11h9v9h-9z"/>
                        </svg>

                        <span>Microsoft</span>
                    </button>

                </div>
            </form>

            <form
                id="form-register"
                class="auth-form-panel"
                novalidate
            >

                <div
                    class="form-error-alert"
                    id="register-error-alert"
                    style="display: none;"
                ></div>

                <div class="input-group" id="group-reg-name">
                    <label for="reg-name">
                        Your Full Name
                        <span class="required">*</span>
                    </label>

                    <div class="input-field-wrap">
                        <span
                            class="input-field-icon"
                            aria-hidden="true"
                        >
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>

                        <input
                            id="reg-name"
                            type="text"
                            placeholder="e.g. Jordan Lee"
                            autocomplete="name"
                            required
                        />
                    </div>

                    <span
                        class="field-error-msg"
                        id="reg-name-error"
                    ></span>
                </div>

                <div class="input-group" id="group-reg-email">
                    <label for="reg-email">
                        Work Email
                        <span class="required">*</span>
                    </label>

                    <div class="input-field-wrap">
                        <span
                            class="input-field-icon"
                            aria-hidden="true"
                        >
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>

                        <input
                            id="reg-email"
                            type="email"
                            placeholder="you@company.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <span
                        class="field-error-msg"
                        id="reg-email-error"
                    ></span>
                </div>

                <div class="input-group" id="group-reg-workspace">
                    <label for="reg-workspace">
                        Workspace / Team Name
                        <span class="required">*</span>
                    </label>

                    <div class="input-field-wrap">
                        <span
                            class="input-field-icon"
                            aria-hidden="true"
                        >
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                            </svg>
                        </span>

                        <input
                            id="reg-workspace"
                            type="text"
                            placeholder="e.g. Northstar Product Launch"
                            value="Product Launch"
                            required
                        />
                    </div>

                    <span
                        class="field-error-msg"
                        id="reg-workspace-error"
                    ></span>
                </div>

                <div class="input-group" id="group-reg-role">
                    <label for="reg-role">
                        Role in Team
                        <span class="required">*</span>
                    </label>

                    <div class="input-field-wrap">
                        <span
                            class="input-field-icon"
                            aria-hidden="true"
                        >
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </span>

                        <select id="reg-role">
                            <option value="Product Lead">Product Lead</option>
                            <option value="Designer">Designer</option>
                            <option value="Engineer">Software Engineer</option>
                            <option value="Marketing">Marketing Manager</option>
                        </select>
                    </div>

                    <span
                        class="field-error-msg"
                        id="reg-role-error"
                    ></span>
                </div>

                <button
                    type="submit"
                    class="auth-submit-btn"
                    id="register-submit-btn"
                >
                    <span>Register & Create Workspace</span>
                    <span>→</span>
                </button>

                <div class="auth-divider">
                    <span>OR SIGN UP WITH</span>
                </div>

                <div class="auth-social-grid">

                    <button
                        type="button"
                        class="auth-social-btn"
                        id="google-register-btn"
                        aria-label="Sign up with Google"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>

                        <span>Google</span>
                    </button>

                    <button
                        type="button"
                        class="auth-social-btn"
                        id="github-register-btn"
                        aria-label="Sign up with GitHub"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="#24292F"
                            aria-hidden="true"
                        >
                            <path
                                fill-rule="evenodd"
                                clip-rule="evenodd"
                                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                            />
                        </svg>

                        <span>GitHub</span>
                    </button>

                    <button
                        type="button"
                        class="auth-social-btn"
                        id="microsoft-register-btn"
                        aria-label="Sign up with Microsoft"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 21 21"
                            aria-hidden="true"
                        >
                            <path fill="#f25022" d="M1 1h9v9H1z"/>
                            <path fill="#7fba00" d="M11 1h9v9h-9z"/>
                            <path fill="#00a4ef" d="M1 11h9v9H1z"/>
                            <path fill="#ffb900" d="M11 11h9v9h-9z"/>
                        </svg>

                        <span>Microsoft</span>
                    </button>

                </div>
            </form>

            <div class="auth-card-footer">
                <a href="../index.html">Back to Collab Home</a>

                <span class="footer-dot">•</span>

                <a href="../legal/privacy.html">
                    Privacy Policy
                </a>

                <span class="footer-dot">•</span>

                <a href="../legal/terms.html">
                    Terms
                </a>

                <span class="footer-dot">•</span>

                <span>
                    © <span class="current-year">2026</span> Collab
                </span>
            </div>

        </div>
    </div>
</div>

<script type="module" src="./auth.js"></script>


</body>

</html>
