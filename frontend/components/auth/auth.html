<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collab — Sign in & Registration</title>
    <meta name="description" content="Sign in or register for your Collab workspace. Instant direct access enabled." />
    <link rel="stylesheet" href="./auth.css">
</head>

<body>
    <div class="auth">

        <div class="auth-container"> 
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-logo">
                    <a href="../dadhboard/dashboard.html"><img src="../../images/logo.png" alt="Collab." class="auth-logo-img" /></a>
                </div>
                
                <h1 id="auth-heading">Sign in</h1>
                <p class="auth-subtitle" id="auth-subheading">Any user can sign in immediately — or register your workspace profile below.</p>
            </div>

            <!-- Tab Switcher: Sign in / Registration -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-signin">Sign In</button>
                <button type="button" class="auth-tab" id="tab-register">Register New Account</button>
            </div>

            <!-- PANEL 1: SIGN IN (Direct access, no registration required) -->
            <form id="form-signin" class="auth-form-panel active">
                <div class="input-group">
                    <label for="signin-user">Name or Email address <span class="required">*</span></label>
                    <input id="signin-user" type="text" placeholder="user@mail.com" />
                </div>

                <div class="input-group">
                    <label for="signin-password">Password <span class="required">*</span></label>
                    <input id="signin-password" type="password" placeholder="••••••••" />
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Enter Workspace Dashboard</span>
                    <span>→</span>
                </button>

                <div class="auth-divider">
                    <span>OR SIGN IN WITH</span>
                </div>

            </form>

            <!-- PANEL 2: REGISTRATION (Hold registration details) -->
            <form id="form-register" class="auth-form-panel">
                <div class="input-group">
                    <label for="reg-name">Your Full Name</label>
                    <input id="reg-name" type="text" placeholder="e.g. Jordan Lee" required />
                </div>

                <div class="input-group">
                    <label for="reg-email">Work Email</label>
                    <input id="reg-email" type="email" placeholder="you@company.com" required />
                </div>

                <div class="input-group">
                    <label for="reg-workspace">Workspace / Team Name</label>
                    <input id="reg-workspace" type="text" placeholder="e.g. Northstar Product Launch" value="Product Launch" />
                </div>

                <div class="input-group">
                    <label for="reg-role">Role in Team</label>
                    <select id="reg-role">
                        <option value="Product Lead">Product Lead</option>
                        <option value="Designer">Designer</option>
                        <option value="Engineer">Software Engineer</option>
                        <option value="Marketing">Marketing Manager</option>
                    </select>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Register & Create Workspace</span>
                    <span>→</span>
                </button>
            </form>
        </div>
    </div>

    </div>

    <script type="module" src="./auth.js"></script>
</body>

</html>
